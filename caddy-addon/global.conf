# global.conf for local network exception
# Set CADDY_TRUSTED_PROXIES in .env to your actual upstream proxy IPs (e.g. 203.0.113.1/32)
servers {
    trusted_proxies static {$CADDY_TRUSTED_PROXIES:private_ranges}

}

# Отключаем OCSP stapling - внутренние сертификаты (.home/.lan) не имеют OCSP сервера
ocsp_stapling off
